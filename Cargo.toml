[package]
name = "sippink"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Paste a link, sip the media: YouTube / X / Pinterest downloader"
repository = "https://github.com/PUTTIPONG-Boss/Sippink"

[dependencies]
dirs = "5"
eframe = "0.27"
egui = "0.27"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
memmap2 = "0.9"
raw-window-handle = "0.6"
rfd = "0.14"
serde_json = "1"
tray-icon = "0.26"
ureq = "2.12"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
strip = true
